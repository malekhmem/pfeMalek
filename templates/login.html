<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ActiBot - ActiaES</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style4.css') }}">
</head>

<body>
    <section>
        <div class="signin">
            <div class="content">
                <!-- Centered logo -->
                <div style="text-align: center;">
                    <img src="{{ url_for('static', filename='images/chatbot.png') }}" alt="Chatbot Logo" style="width: 160px; height: auto;">
                </div>

                <!-- Title -->
                <h2>WELCOME !</h2>

                <!-- Login Form -->
                <form method="POST" class="form" action="{{ url_for('auth.login') }}">
                    {{ form.hidden_tag() }}

                    <!-- Email Input Box -->
                    <div class="inputBox">
                        {{ form.email.label }}
                        {{ form.email }}
                    </div>

                    <!-- Password Input Box -->
                    <div class="inputBox">
                        {{ form.password.label }}
                        {{ form.password }}
                    </div>

                    <!-- Links to other pages -->
                    <div class="links">
                        <a href="#">Forgot Password</a>
                        <a href="{{ url_for('auth.register') }}">Signup</a>
                    </div>

                    <!-- Login Button -->
                    <div class="inputBox">
                        {{ form.submit(class_='btn') }}
                    </div>
                </form>

            </div>
        </div>
    </section>
</body>

</html>
